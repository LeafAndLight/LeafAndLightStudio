<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Leaf &amp; Light Studio — editable sharing artwork</title>
  <!-- Editable source for open-graph-2026-10.png. Export .cover at 1200 × 630,
       device scale 1, after all images and fonts have loaded. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10251f; }
    .cover {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: #fffaf2;
      background: #10251f;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .art { position: absolute; inset: 0 0 0 515px; }
    .scene { position: absolute; top: 0; height: 100%; overflow: hidden; }
    .scene img { width: 100%; height: 100%; object-fit: cover; }
    .scene--arena {
      left: 0; width: 335px;
      clip-path: polygon(27% 0, 100% 0, 73% 100%, 0 100%);
    }
    .scene--arena img { object-position: 54% center; }
    .scene--prison {
      left: 250px; width: 310px;
      clip-path: polygon(29% 0, 100% 0, 71% 100%, 0 100%);
    }
    .scene--prison img { object-position: 51% center; filter: brightness(1.32); }
    .scene--climb {
      left: 480px; width: 295px;
      clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%);
    }
    .scene--climb img { object-position: 49% center; }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(0deg, rgba(8, 23, 20, .7), transparent 48%),
        linear-gradient(90deg, #10251f 0%, #10251f 35%, rgba(16, 37, 31, .85) 43%, rgba(16, 37, 31, .1) 62%, transparent 76%);
    }
    .glow {
      position: absolute; left: -160px; top: -150px; width: 690px; height: 600px;
      background: radial-gradient(ellipse, rgba(97, 141, 94, .18), transparent 69%);
    }
    .logo { position: absolute; left: 58px; top: 70px; width: 430px; height: 185px; object-fit: contain; }
    .copy { position: absolute; left: 64px; top: 310px; }
    h1 { margin: 0; font-size: 66px; font-weight: 750; line-height: 1.06; letter-spacing: -2px; }
    h1 span { color: #f2a20a; }
    .platforms { margin: 27px 0 0; color: #cfdbcf; font-size: 21px; font-weight: 500; letter-spacing: .3px; }
    .footer {
      position: absolute; bottom: 42px; left: 64px; right: 48px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 18px; font-weight: 600; color: #fffaf2;
    }
    .domain { display: flex; align-items: center; gap: 12px; }
    .domain::before { content: ""; width: 28px; height: 3px; background: #f2a20a; }
    .category { letter-spacing: 3px; font-size: 13px; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="cover" aria-label="Leaf &amp; Light Studio: VR games and playable worlds">
    <div class="art" aria-hidden="true">
      <div class="scene scene--arena"><img src="../hero/01-car_crash.png" alt="" /></div>
      <div class="scene scene--prison"><img src="../portfolio/im-prisoner/im-prisoner-main-cells-new.png" alt="" /></div>
      <div class="scene scene--climb"><img src="../hero/03-infinity-climb.png" alt="" /></div>
    </div>
    <div class="shade"></div>
    <div class="glow"></div>
    <img class="logo" src="logo-horizontal-reversed.png" alt="Leaf &amp; Light Studio" />
    <div class="copy">
      <h1>We build<br /><span>playable worlds.</span></h1>
      <p class="platforms">VR games · Meta Quest · PC</p>
    </div>
    <div class="footer"><span class="domain">leaflight.com.br</span><span class="category">Independent game studio</span></div>
  </main>
</body>
</html>
